spring.application.name=exam-system

# H2 Database
spring.datasource.url=jdbc:h2:mem:examdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Demo seed data passwords (configure via environment variables)
exam.admin.password=${EXAM_ADMIN_PWD:changeme}
exam.student.password=${EXAM_STUDENT_PWD:changeme}
