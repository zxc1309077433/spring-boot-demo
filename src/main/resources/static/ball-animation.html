<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Track Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.3);
        }
        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .controls button {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            background: rgba(102, 126, 234, 0.8);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .controls button:hover {
            background: rgba(102, 126, 234, 1);
            transform: scale(1.05);
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="resetBall()">Reset</button>
        <button onclick="togglePause()">Pause / Resume</button>
        <button onclick="addBall()">+ Add Ball</button>
    </div>
    <canvas id="canvas"></canvas>
    <div class="info">Ball Track Animation | Spring Boot Demo</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 900;
        canvas.height = 600;

        const gravity = 0.4;
        const friction = 0.99;
        const bounceFactor = 0.75;

        // Track definition - a series of curved segments
        const trackPoints = [];
        function generateTrack() {
            trackPoints.length = 0;
            const segments = 200;
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = t * canvas.width;
                const y = canvas.height * 0.5
                    + Math.sin(t * Math.PI * 3) * 80
                    + Math.sin(t * Math.PI * 5) * 30
                    + Math.cos(t * Math.PI * 1.5) * 60;
                trackPoints.push({ x, y: Math.min(y, canvas.height - 30) });
            }
        }
        generateTrack();

        // Ball class
        class Ball {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.vx = 2 + Math.random() * 2;
                this.vy = 0;
                this.radius = radius;
                this.color = color;
                this.rotation = 0;
                this.trail = [];
                this.onTrack = false;
            }

            getTrackYAt(px) {
                if (px < trackPoints[0].x || px > trackPoints[trackPoints.length - 1].x) return null;
                for (let i = 0; i < trackPoints.length - 1; i++) {
                    if (px >= trackPoints[i].x && px <= trackPoints[i + 1].x) {
                        const t = (px - trackPoints[i].x) / (trackPoints[i + 1].x - trackPoints[i].x);
                        return trackPoints[i].y + t * (trackPoints[i + 1].y - trackPoints[i].y);
                    }
                }
                return null;
            }

            getTrackAngleAt(px) {
                for (let i = 0; i < trackPoints.length - 1; i++) {
                    if (px >= trackPoints[i].x && px <= trackPoints[i + 1].x) {
                        const dx = trackPoints[i + 1].x - trackPoints[i].x;
                        const dy = trackPoints[i + 1].y - trackPoints[i].y;
                        return Math.atan2(dy, dx);
                    }
                }
                return 0;
            }

            update() {
                // Store trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 30) this.trail.shift();

                // Apply gravity
                this.vy += gravity;

                // Apply friction
                this.vx *= friction;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Track collision
                const trackY = this.getTrackYAt(this.x);
                if (trackY !== null) {
                    const surfaceY = trackY - this.radius;
                    if (this.y >= surfaceY) {
                        this.y = surfaceY;
                        const angle = this.getTrackAngleAt(this.x);
                        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);

                        // Bounce
                        if (this.vy > 2) {
                            this.vy = -this.vy * bounceFactor;
                            this.onTrack = false;
                        } else {
                            // Roll along track
                            this.vy = 0;
                            this.vx += Math.sin(angle) * 0.5;
                            this.onTrack = true;
                        }
                    } else {
                        this.onTrack = false;
                    }
                }

                // Rotation based on horizontal velocity
                this.rotation += this.vx * 0.05;

                // Wrap around
                if (this.x > canvas.width + this.radius) {
                    this.x = -this.radius;
                    this.trail = [];
                }
                if (this.x < -this.radius) {
                    this.x = canvas.width + this.radius;
                    this.trail = [];
                }

                // Floor collision
                if (this.y > canvas.height - this.radius) {
                    this.y = canvas.height - this.radius;
                    this.vy = -this.vy * bounceFactor;
                }
            }

            draw() {
                // Draw trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = this.color + '40';
                    ctx.lineWidth = this.radius * 0.8;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Draw shadow
                ctx.beginPath();
                const trackY = this.getTrackYAt(this.x);
                const shadowY = trackY || canvas.height;
                ctx.ellipse(this.x, shadowY, this.radius * 0.8, this.radius * 0.2, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();

                // Draw ball
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Gradient
                const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, this.color);
                grad.addColorStop(1, this.darken(this.color, 40));

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Pattern lines on ball
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-this.radius, 0);
                ctx.lineTo(this.radius, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(0, this.radius);
                ctx.stroke();

                ctx.restore();
            }

            darken(hex, amount) {
                let r = parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(5, 7), 16);
                r = Math.max(0, r - amount);
                g = Math.max(0, g - amount);
                b = Math.max(0, b - amount);
                return `rgb(${r},${g},${b})`;
            }
        }

        const ballColors = ['#667eea', '#f093fb', '#4fd1c5', '#f6ad55', '#fc8181', '#68d391'];
        let balls = [
            new Ball(50, 100, 18, ballColors[0]),
            new Ball(120, 60, 14, ballColors[1]),
        ];

        let paused = false;

        function resetBall() {
            balls = [
                new Ball(50, 100, 18, ballColors[0]),
                new Ball(120, 60, 14, ballColors[1]),
            ];
        }

        function togglePause() {
            paused = !paused;
            if (!paused) animate();
        }

        function addBall() {
            const color = ballColors[balls.length % ballColors.length];
            const radius = 12 + Math.random() * 10;
            balls.push(new Ball(30 + Math.random() * 100, 50 + Math.random() * 80, radius, color));
        }

        function drawTrack() {
            // Track glow
            ctx.shadowColor = 'rgba(102, 126, 234, 0.4)';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
            for (let i = 1; i < trackPoints.length; i++) {
                ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
            }
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.6)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Track surface
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
            for (let i = 1; i < trackPoints.length; i++) {
                ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            const trackGrad = ctx.createLinearGradient(0, canvas.height * 0.3, 0, canvas.height);
            trackGrad.addColorStop(0, 'rgba(102, 126, 234, 0.15)');
            trackGrad.addColorStop(1, 'rgba(102, 126, 234, 0.05)');
            ctx.fillStyle = trackGrad;
            ctx.fill();
        }

        function drawBackground() {
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#16213e');
            bgGrad.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = 0; i < 50; i++) {
                const sx = (i * 137.5 + 50) % canvas.width;
                const sy = (i * 97.3 + 30) % (canvas.height * 0.4);
                const size = (i % 3) + 0.5;
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            if (paused) return;

            drawBackground();
            drawTrack();

            for (const ball of balls) {
                ball.update();
                ball.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
